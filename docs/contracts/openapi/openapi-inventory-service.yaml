openapi: 3.0.3
info:
  title: Inventory Service API
  description: |
    Flight inventory management and Amadeus API integration.
    Handles flight search, offers, and reservation management.
  version: 1.0.0
  contact:
    name: API Support
    email: api-support@company.com

servers:
  - url: http://localhost:3005
    description: Local development
  - url: http://inventory-service:3005
    description: Docker internal
  - url: https://api.travel.company.com/api/flights
    description: Production

tags:
  - name: Flights
    description: Flight search and offers
  - name: Reservations
    description: Flight reservation management
  - name: Health
    description: Service health checks

paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /ready:
    get:
      summary: Readiness check
      tags: [Health]
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: string
                  amadeus:
                    type: string

  /flights/search:
    get:
      summary: Search flights
      description: Search for flight offers (no authentication required)
      tags: [Flights]
      parameters:
        - name: origin
          in: query
          required: true
          description: Origin airport IATA code
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
          example: JFK
        - name: destination
          in: query
          required: true
          description: Destination airport IATA code
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
          example: LAX
        - name: departureDate
          in: query
          required: true
          description: Departure date
          schema:
            type: string
            format: date
          example: "2024-06-15"
        - name: returnDate
          in: query
          description: Return date (for round trip)
          schema:
            type: string
            format: date
          example: "2024-06-20"
        - name: adults
          in: query
          description: Number of adult passengers
          schema:
            type: integer
            minimum: 1
            maximum: 9
            default: 1
        - name: children
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 9
            default: 0
        - name: infants
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 9
            default: 0
        - name: cabinClass
          in: query
          description: Preferred cabin class
          schema:
            type: string
            enum: [ECONOMY, PREMIUM_ECONOMY, BUSINESS, FIRST]
            default: ECONOMY
        - name: nonStop
          in: query
          description: Only show non-stop flights
          schema:
            type: boolean
            default: false
        - name: maxResults
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
      responses:
        '200':
          description: Flight search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlightOffer'
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 42
                      cached:
                        type: boolean
                        example: true
                      searchId:
                        type: string
                        format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'

  /flights/offers/{offerId}:
    get:
      summary: Get flight offer details
      description: Retrieve detailed information about a specific offer
      tags: [Flights]
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flight offer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightOffer'
        '404':
          $ref: '#/components/responses/NotFound'

  /flights/offers/{offerId}/pricing:
    get:
      summary: Get current pricing for offer
      description: Get up-to-date pricing before booking
      tags: [Flights]
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current pricing
          content:
            application/json:
              schema:
                type: object
                properties:
                  offerId:
                    type: string
                  price:
                    $ref: '#/components/schemas/Price'
                  priceChanged:
                    type: boolean
                  originalPrice:
                    $ref: '#/components/schemas/Price'
                  validUntil:
                    type: string
                    format: date-time
        '404':
          $ref: '#/components/responses/NotFound'

  /reservations:
    get:
      summary: List reservations
      description: Get all reservations for authenticated user
      tags: [Reservations]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [CONFIRMED, CANCELLED, EXPIRED]
      responses:
        '200':
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create flight reservation
      description: Reserve a flight (does not issue ticket)
      tags: [Reservations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Offer no longer available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservations/{reservationId}:
    get:
      summary: Get reservation details
      tags: [Reservations]
      security:
        - bearerAuth: []
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reservation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /reservations/{reservationId}/cancel:
    post:
      summary: Cancel reservation
      description: Cancel a flight reservation (compensation action for Saga)
      tags: [Reservations]
      security:
        - bearerAuth: []
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reservation cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservationId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: CANCELLED
                  cancelledAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Reservation cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /airports/search:
    get:
      summary: Search airports
      description: Search for airports by name or code
      tags: [Flights]
      parameters:
        - name: query
          in: query
          required: true
          description: Search query (airport name or code)
          schema:
            type: string
            minLength: 2
          example: Los Angeles
      responses:
        '200':
          description: Airport search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Airport'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    FlightOffer:
      type: object
      properties:
        id:
          type: string
          example: FLT-NYC-LAX-2024-001
        type:
          type: string
          example: flight-offer
        source:
          type: string
          example: AMADEUS
        instantTicketingRequired:
          type: boolean
        nonHomogeneous:
          type: boolean
        oneWay:
          type: boolean
        lastTicketingDate:
          type: string
          format: date
        numberOfBookableSeats:
          type: integer
          example: 9
        itineraries:
          type: array
          items:
            $ref: '#/components/schemas/Itinerary'
        price:
          $ref: '#/components/schemas/Price'
        pricingOptions:
          type: object
          properties:
            fareType:
              type: array
              items:
                type: string
            includedCheckedBagsOnly:
              type: boolean
        validatingAirlineCodes:
          type: array
          items:
            type: string
          example: ["UA"]
        travelerPricings:
          type: array
          items:
            $ref: '#/components/schemas/TravelerPricing'

    Itinerary:
      type: object
      properties:
        duration:
          type: string
          example: PT5H30M
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'

    Segment:
      type: object
      properties:
        departure:
          $ref: '#/components/schemas/FlightPoint'
        arrival:
          $ref: '#/components/schemas/FlightPoint'
        carrierCode:
          type: string
          example: UA
        carrierName:
          type: string
          example: United Airlines
        number:
          type: string
          example: "1234"
        aircraft:
          type: object
          properties:
            code:
              type: string
              example: "738"
        operating:
          type: object
          properties:
            carrierCode:
              type: string
        duration:
          type: string
          example: PT5H30M
        id:
          type: string
        numberOfStops:
          type: integer
        blacklistedInEU:
          type: boolean

    FlightPoint:
      type: object
      properties:
        iataCode:
          type: string
          example: LAX
        terminal:
          type: string
          example: "1"
        at:
          type: string
          format: date-time
          example: "2024-06-15T14:30:00"

    Price:
      type: object
      properties:
        currency:
          type: string
          example: USD
        total:
          type: string
          example: "450.00"
        base:
          type: string
          example: "350.00"
        fees:
          type: array
          items:
            type: object
            properties:
              amount:
                type: string
              type:
                type: string
        grandTotal:
          type: string
          example: "450.00"

    TravelerPricing:
      type: object
      properties:
        travelerId:
          type: string
        fareOption:
          type: string
        travelerType:
          type: string
          enum: [ADULT, CHILD, INFANT]
        price:
          $ref: '#/components/schemas/Price'
        fareDetailsBySegment:
          type: array
          items:
            type: object

    CreateReservationRequest:
      type: object
      required:
        - offerId
        - travelers
      properties:
        offerId:
          type: string
          example: FLT-NYC-LAX-2024-001
        travelers:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - firstName
              - lastName
              - dateOfBirth
              - gender
            properties:
              id:
                type: string
                example: "1"
              firstName:
                type: string
                example: John
              lastName:
                type: string
                example: Doe
              dateOfBirth:
                type: string
                format: date
                example: "1985-05-15"
              gender:
                type: string
                enum: [MALE, FEMALE]
              email:
                type: string
                format: email
              phone:
                type: string
              documents:
                type: array
                items:
                  type: object
                  properties:
                    documentType:
                      type: string
                      enum: [PASSPORT, IDENTITY_CARD]
                    number:
                      type: string
                    expiryDate:
                      type: string
                      format: date
                    issuanceCountry:
                      type: string
                    nationality:
                      type: string

    Reservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pnr:
          type: string
          example: ABC123
          description: Passenger Name Record
        status:
          type: string
          enum: [CONFIRMED, CANCELLED, EXPIRED]
          example: CONFIRMED
        offerId:
          type: string
        amadeusBookingId:
          type: string
        travelers:
          type: array
          items:
            type: object
        itineraries:
          type: array
          items:
            $ref: '#/components/schemas/Itinerary'
        price:
          $ref: '#/components/schemas/Price'
        expiresAt:
          type: string
          format: date-time
          description: Reservation expiration time
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time

    Airport:
      type: object
      properties:
        iataCode:
          type: string
          example: LAX
        name:
          type: string
          example: Los Angeles International Airport
        city:
          type: string
          example: Los Angeles
        country:
          type: string
          example: United States
        timezone:
          type: string
          example: America/Los_Angeles

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object

    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
        totalPages:
          type: integer
        totalItems:
          type: integer
        limit:
          type: integer

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
